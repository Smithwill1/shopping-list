<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shopping">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Shopping List</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f0;
    --card: #ffffff;
    --text: #1c1c1c;
    --muted: #7a7a72;
    --accent: #2f6f4f;
    --border: #e2e2da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --card: #1f2118;
      --text: #f0f0e8;
      --muted: #9a9a8e;
      --accent: #5fb37f;
      --border: #34362a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header {
    padding: 20px 4px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  #clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 6px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }
  button[type="submit"] {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 1.3rem;
    font-weight: 600;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  li .check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }
  li.done .check { background: var(--accent); }
  li .label { flex: 1; font-size: 1.05rem; word-break: break-word; }
  li.done .label { text-decoration: line-through; color: var(--muted); }
  li .remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    padding: 4px 8px;
  }
  #empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    display: none;
  }
</style>
</head>
<body>
  <header>
    <h1>🛒 Shopping List</h1>
    <button id="clear-btn" type="button">Clear checked</button>
  </header>

  <form id="add-form">
    <input id="item-input" type="text" placeholder="Add an item…" autocomplete="off" required>
    <button type="submit">+</button>
  </form>

  <ul id="list"></ul>
  <p id="empty">List's empty — add something above.</p>

  <script src="app.js"></script>
</body>
</html>
